statement: "Filliot estime à environ 160 000 le nombre d'esclaves arrivés aux Mascareignes de 1670 à 1810, dont quelque 45 % de Malgaches, 40 % d'Africains de la côte orientale, 13 % d'Indiens et 2 % d'Africains de l'Ouest."
statut: reconstruit
discipline: histoire
domain: economie
period: [1670, 1810]
sources: [filliot-1974]
scope: [ile-madagascar]
note: "L'auteur le dit lui-même : le chiffre « ne repose pas sur une source mais sur la totalité des renseignements recueillis et recoupés », environ un millier. C'est une estimation de 1974 ; Reidy 2020 signale que R. B. Allen a depuis porté le nombre de voyages vers les Mascareignes de 600 à 950, travail non lu ici, si bien que le total est probablement sous-estimé."
