statement: "Le préfixe honorifique ra-, celui de Radama et de Rainilaiarivony, est emprunté au javanais, et l'emprunt s'est fait à Bornéo avant le départ."
statut: reconstruit
discipline: linguistique
domain: peuplement
sources: [adelaar-2016]
note: "Le préfixe se retrouve dans tous les dialectes malgaches, donc il appartenait déjà à la langue avant sa dispersion sur l'île. Or le javanais tenait un rôle hégémonique dans l'histoire ancienne du sud de Kalimantan et n'en a joué aucun à Madagascar : l'emprunt est bien plus vraisemblable en amont du voyage. Il se superpose à un marqueur plus ancien, hérité, que le malgache garde sous les formes i- et z-."
scope: [austronesiens, ile-madagascar]
