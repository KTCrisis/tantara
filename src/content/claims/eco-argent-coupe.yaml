statement: "En Imerina, dans les années 1830, les sommes inférieures à une piastre se règlent en argent coupé et pesé : les piastres sont découpées et pesées avec quatre poids de fer, la moitié, le quart, le huitième et le douzième (loso, kirobo, sikajy, roavoamena), et les plus petites sommes se comptent en grains de riz, jusqu'au sept cent vingtième de piastre ; changeurs et marchands de balances tiennent leur place au marché."
