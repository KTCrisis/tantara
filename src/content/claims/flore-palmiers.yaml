statement: "Madagascar compte cent quatre-vingt-quinze espèces de palmiers réparties en dix-sept genres, dont cent quatre-vingt-douze ne poussent nulle part ailleurs ; quatre-vingt-trois pour cent des espèces endémiques sont menacées d'extinction, proportion près de quatre fois supérieure à celle des plantes dans le monde."
statut: mesuré
discipline: biologie
domain: flore-avant
period: [2012, 2014]
sources: [rakotoarinivo-2014]
scope: [ile-madagascar]
note: "Évaluation exhaustive du groupe selon les critères de la liste rouge : soixante et une espèces en danger critique, quarante-cinq en danger, quarante-trois vulnérables. C'est le taux le plus élevé de tous les groupes végétaux évalués sur l'île."
