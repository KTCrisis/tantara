statement: "Toute la faune de vertébrés terrestres de Madagascar descend d'une trentaine de lignées seulement, chacune issue d'une arrivée distincte : cinq lignées d'amphibiens, cinq de mammifères terrestres et vingt de reptiles."
statut: reconstruit
discipline: biologie
domain: faune-avant
sources: [ali-hedges-2025]
scope: [ile-madagascar]
note: "Le décompte porte sur les lignées, pas sur les espèces : chaque lignée a ensuite produit des dizaines ou des centaines de formes. Les oiseaux et les chauves-souris sont écartés de ces comptages, parce qu'ils traversent la mer sans difficulté et ne renseignent donc pas sur le mode d'arrivée des autres. Les cinq lignées de mammifères comptées ici dépassent d'une unité les quatre groupes datés par Poux et coll. en 2005, que les mêmes auteurs qualifient d'« alors quatre » : le compte de quatre porte sur les groupes vivants, celui de cinq sur un périmètre élargi. Cette page suit le compte de quatre chaque fois qu'elle parle des groupes actuels. La distance à l'Afrique et l'âge de la séparation, que cette source chiffre à 430 kilomètres et 85 millions d'années, sont portés ailleurs dans le corpus par des assertions dédiées, aux valeurs de leurs propres sources."
