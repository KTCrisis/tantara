statement: "Les Malgaches partagent davantage d'ADN autosomique avec les habitants de la ville portuaire de Banjarmasin qu'avec les Ma'anyan de l'intérieur, dont ils tiennent pourtant leur langue."
statut: reconstruit
discipline: génétique
domain: peuplement
sources: [adelaar-2016]
note: "Résultat de Brucato et al. 2016, rapporté et interprété par Adelaar 2016, dont le corpus ne conserve que la restitution. Les ports de Bornéo ont été fondés par des noyaux malophones qui absorbaient un afflux continu de gens de l'arrière-pays : une population de métropole, malaise de langue et de culture, mais apparentée aux populations du dehors. Le départ se serait fait depuis ce milieu portuaire, non depuis le village d'origine."
scope: [austronesiens, ile-madagascar]
