statement: "Le ravenala, l'arbre du voyageur, tire son nom de l'eau que retiennent les gaines de ses feuilles ; ses fleurs sont ouvertes et visitées par le vari noir et blanc, un lémurien qui écarte les bractées de ses mains pour atteindre le nectar et ressort couvert de pollen, ce qui en ferait l'un des rares cas connus de pollinisation par un primate."
statut: reconstruit
discipline: biologie
domain: flore-avant
sources: [kress-1994]
scope: [ile-madagascar]
note: "Les auteurs eux-mêmes posent la question plutôt qu'ils ne la referment : le titre de leur article se termine par un point d'interrogation, et ils parlent d'un système coévolutif possiblement archaïque, non démontré. Ce qui est observé, ce sont les visites et le transport de pollen ; ce qui est supposé, c'est l'ancienneté du lien et son exclusivité."
