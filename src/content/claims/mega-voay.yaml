statement: "L'île avait son propre crocodile, le crocodile à cornes Voay robustus, décrit en 1872 par Grandidier et Vaillant et disparu depuis : l'ADN mitochondrial lu sur des ossements vieux de mille trois cents à mille quatre cents ans le place comme groupe frère des crocodiles vrais, et non comme une forme de ceux-ci."
statut: reconstruit
discipline: génétique
domain: megafaune
period: [-2500, 700]
sources: [hekkala-2021]
scope: [ile-madagascar]
note: "Le crocodile qui vit aujourd'hui dans l'île n'est pas son descendant mais le crocodile du Nil, arrivé du continent. La position phylogénétique de Voay était discutée depuis un siècle et demi faute d'un caractère décisif dans les os ; deux génomes partiels, extraits de restes datant de la période où les hommes sont déjà là, l'ont tranchée. La borne haute de la période porte sur les ossements analysés, pas sur la date d'extinction, qui n'est pas établie ici."
