statement: "Les deux tiers orientaux de Madagascar reposent sur un socle précambrien de roches fortement déformées et métamorphisées, dont les âges s'échelonnent de l'Archéen au Néoprotérozoïque ; le tiers occidental est recouvert de sédiments quasi horizontaux déposés depuis le Carbonifère."
statut: mesuré
discipline: géologie
domain: geographie-physique
period: [-3000000000, -300000000]
sources: [moine-2014]
scope: [ile-madagascar]
note: "La coupure est-ouest n'est donc pas seulement une affaire de relief : les deux versants ne sont pas faits de la même roche. Voir geo-asymetrie-relief."
