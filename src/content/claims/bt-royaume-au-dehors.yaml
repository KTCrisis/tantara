statement: "La confédération se présentait au monde extérieur comme un royaume, organisé autour de la figure charismatique d'un fils de pirate, mais fonctionnait à l'intérieur en démocratie décentralisée, sans système développé de rang social."
statut: reconstruit
discipline: histoire
domain: betsimisaraka
period: [1712, 1820]
sources: [graeber-2023]
note: "L'auteur y voit une anomalie historique et cherche l'analogie du côté des équipages pirates eux-mêmes, dont les capitaines se donnaient au dehors une réputation d'autorité terrifiante. Lecture d'un auteur sur une source unique, d'où le statut reconstruit."
scope: [confederation-betsimisaraka, betsimisaraka]
