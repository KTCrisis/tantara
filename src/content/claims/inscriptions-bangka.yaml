statement: "Les plus anciennes inscriptions en vieux malais, gravées au VIIe siècle dans le sud de Sumatra et sur l'île de Bangka, comportent quelques lignes dans une langue restée non identifiée, qui pourrait relever du barito oriental, sinon du malgache ancien."
statut: conjectural
discipline: linguistique
domain: peuplement
sources: [adelaar-2016, dahl-1951]
note: "Lecture proposée par Aichele en 1936, reprise par Dahl puis par Adelaar, et jamais démontrée. Si elle tient, ces pierres seraient le seul document écrit contemporain du monde d'où les ancêtres sont partis, et elles y porteraient leur langue. Elles appartiennent au corpus de Srivijaya, la puissance maritime qui tenait alors les détroits."
period: [682, 686]
scope: [austronesiens]
