statement: "Ces quatre groupes ne représentent que quatre des seize ordres de mammifères placentaires terrestres : douze ordres n'ont jamais atteint l'île, dont ceux qui fournissent ailleurs les grands herbivores et les grands prédateurs."
statut: mesuré
discipline: biologie
domain: faune-avant
sources: [poux-2005]
scope: [ile-madagascar]
note: "L'absence est ici une donnée au même titre que la présence : ni antilopes, ni zèbres, ni éléphants, ni grands félins, alors que tous vivent à quatre cents kilomètres de là. Les places qu'ils occupent sur le continent ont été prises à Madagascar par les descendants des quatre lignées arrivées, ce qui explique des formes sans équivalent ailleurs."
