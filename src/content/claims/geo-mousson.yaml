statement: "Le régime des vents du sud-ouest de l'océan Indien s'inverse deux fois par an : mousson de nord-est de novembre à avril, qui établit un flux vers l'ouest à travers tout l'océan, puis mousson de sud-ouest de mai à octobre, plus intense ; le renversement fait tourner les vents dominants de plus de quatre-vingt-dix degrés."
statut: mesuré
discipline: climat
domain: geographie-physique
sources: [guyomard-2006]
scope: [ile-madagascar]
note: "Régime actuel, mesuré. Le site n'en déduit aucun itinéraire : que le vent permette l'aller-retour ne dit pas qui l'a emprunté, ni quand."
