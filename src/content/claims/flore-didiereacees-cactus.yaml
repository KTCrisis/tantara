statement: "Les didiéracées appartiennent à la même alliance que les cactus, avec les Portulacaceae et les Basellaceae, un ensemble dont la monophylie est établie depuis les premières analyses cladistiques."
statut: reconstruit
discipline: biologie
domain: flore-avant
sources: [applequist-2003]
scope: [ile-madagascar]
note: "La conséquence est contre-intuitive. Un tronc dressé, épineux et gorgé d'eau dans un pays sec passe pour l'exemple d'école de la convergence, deux lignées sans lien qui trouvent la même solution. Ici la parenté est réelle : ce sont des cousines qui se ressemblent, ce qui affaiblit l'exemple sans rien retirer au fait. Les trois familles voisines, cactus compris, sont d'ailleurs issues de Portulacaceae paraphylétiques, ce qui a rendu la classification du groupe longtemps instable."
