statement: "La mobilisation politique qui crée la confédération betsimisaraka n'est pas l'œuvre des pirates, ni celle de leurs fils, encore enfants pour la plupart à cette date. Les pirates vivaient dans les ports et observaient les événements, mais ils s'y sont tenus à l'écart."
statut: reconstruit
discipline: histoire
domain: betsimisaraka
period: [1700, 1730]
sources: [graeber-2023]
note: "Conclusion de l'auteur d'un livre intitulé Pirate Enlightenment, qui conclut donc contre l'attente que son titre installe. Elle repose sur la lecture d'une source unique, le manuscrit de Mayeur, et le site la range en reconstruit à ce titre."
scope: [confederation-betsimisaraka, betsimisaraka]
