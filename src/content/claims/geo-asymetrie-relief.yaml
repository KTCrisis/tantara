statement: "Le relief de Madagascar est fortement asymétrique d'est en ouest : le flanc occidental descend en pente douce, la transition de la plaine côtière au plateau s'étalant sur des centaines de kilomètres, tandis que la marge orientale est barrée par un escarpement qui atteint par endroits plus de 2 000 m de dénivelé, gagnés en quelques dizaines de kilomètres depuis la côte."
statut: mesuré
discipline: géologie
domain: geographie-physique
sources: [clementucci-2025]
scope: [ile-madagascar]
note: "Mesuré sur l'analyse topographique et les taux d'érosion ; l'escarpement est un trait linéaire de près de mille kilomètres, il n'est pas porté sur les cartes du site, qui placent des points."
