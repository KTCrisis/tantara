statement: "Le tapia, Uapaca bojeri, est un arbre endémique qui forme sur le versant occidental des Hautes Terres une formation sclérophylle presque monospécifique, environ deux mille six cents kilomètres carrés répartis en massifs disjoints, entre huit cents et mille six cents mètres, là où la saison sèche dure jusqu'à sept mois."
statut: mesuré
discipline: biologie
domain: flore-avant
sources: [kull-2002]
scope: [ile-madagascar, isalo]
note: "C'est l'une des rares formations boisées endémiques qui subsistent sur les Hautes Terres, un domaine par ailleurs occupé par les prairies, les rizières et les plantations de pins et d'eucalyptus. Les massifs vont d'Imamo, à l'ouest de la capitale, jusqu'au massif de l'Isalo au sud. L'allure du peuplement rappelle celle des chênaies méditerranéennes."
