statement: "Les didiéracées au sens strict ne comptent que quatre genres et onze espèces, Didierea, Alluaudia, Alluaudiopsis et Decaryia, toutes ligneuses, succulentes, et toutes cantonnées au sud-ouest de Madagascar."
statut: mesuré
discipline: biologie
domain: flore-avant
sources: [applequist-2003]
scope: [ile-madagascar]
note: "Onze espèces pour une famille entière : c'est peu, et c'est ce qui rend le groupe remarquable. Les auteurs du transfert de 2003 les décrivent eux-mêmes comme « très distinctives », au point de leur réserver une sous-famille à part, les Didiereoideae, quand ils ont dû élargir la famille."
