statement: "La couronne qui surmontait le dais royal de Ranavalona III, emportée en 1897 et exposée au musée de l'Armée à Paris depuis 1910, est remise à Madagascar le 5 novembre 2020, pour l'inauguration du Rova d'Antananarivo restauré. Le geste est fait sous la forme d'un dépôt et non d'une restitution, il est contesté en France, et une proposition de loi est déposée le 4 mai 2021 pour la restituer en propre."
statut: attesté
discipline: histoire
domain: imerina-souverains
sources: [lemonde-couronne-2020, an-couronne-2021]
note: "Assertion d'historiographie et de ses suites, sans date de fait : elle n'entre donc pas dans la frise, au même titre que la compilation de Callet."
scope: [royaume-imerina, merina]
