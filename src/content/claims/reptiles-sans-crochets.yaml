statement: "Aucun serpent de Madagascar ne porte de crochets à venin à l'avant de la mâchoire, la disposition qui arme ailleurs les vipères et les cobras ; les espèces de l'île sont tenues pour comparativement inoffensives."
statut: mesuré
discipline: biologie
domain: megafaune
sources: [razafimahatratra-2015]
scope: [ile-madagascar]
note: "L'article qui énonce ce fait est celui-là même qui en montre la limite : il décrit un cas d'envenimation par Leioheterodon madagascariensis, espèce dépourvue de crochets et réputée sans danger, et publie la description de sa dentition. Inoffensif ne veut donc pas dire sans venin, mais sans l'appareil qui l'injecte efficacement."
