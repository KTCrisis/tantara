statement: "Le fitampoha, cérémonie de la monarchie sakalava du Menabe, a pour apogée le bain des reliques royales dans le fleuve Tsiribihina."
statut: attesté
discipline: ethnographie
domain: sakalava
sources: [ballarin-2020]
note: "Le rite se tient encore : la photographie qui l'illustre dans la littérature savante date de 2008."
scope: [sakalava, royaume-menabe]
