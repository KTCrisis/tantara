statement: "Au XIXe siècle, Madagascar, longtemps exportatrice d'esclaves, se met à importer massivement des captifs d'Afrique orientale, que l'île désigne tous par les termes génériques de « Makoa » ou de « Masombika »."
statut: attesté
discipline: histoire
domain: economie
axes: [sakalava]
period: [1800, 1896]
sources: [boyer-rossol-2015, campbell-1981]
scope: [makoa, ile-madagascar]
note: "Campbell 1981 rattache cette importation à l'essor de l'empire merina et la tient pour un phénomène propre au XIXe siècle. L'article est lu par son seul extrait public."
