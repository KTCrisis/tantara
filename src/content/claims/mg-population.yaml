note: "Chiffres des indicateurs du développement dans le monde, relevés en 2024 : 31 964 956 habitants, 39,3 % de moins de quinze ans, 32,4 % de population urbaine. L'estimation pour 2025 dépasse les trente-deux millions et demi."
