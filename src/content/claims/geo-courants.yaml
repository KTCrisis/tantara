statement: "Dans la configuration actuelle, le courant sud-équatorial traverse l'océan Indien vers l'ouest et se sépare sur la côte est de Madagascar en deux branches, le courant nord-est malgache et le courant sud-est malgache ; la première se retourne vers le sud en longeant l'Afrique, formant le courant du Mozambique, et engendre des tourbillons au voisinage des Comores."
statut: mesuré
discipline: climat
domain: geographie-physique
period: [1950, 2025]
sources: [chenillat-2024]
scope: [ile-madagascar]
note: "Mesurée par altimétrie satellitaire et mouillages, donc sur les dernières décennies. Ce qu'était cette circulation il y a mille ans n'est pas établi ici, et rien ne dit qu'elle a porté telle ou telle traversée : voir navigation-trajet, qui reste débattu."
