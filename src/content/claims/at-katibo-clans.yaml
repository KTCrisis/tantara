statement: "Les manuscrits sorabe sont détenus par des chefs religieux, les katibo, et par des devins-guérisseurs, qui appartiennent à des clans spécifiques : les Anakara sont les spécialistes du ciel, les Zafintsimeto ceux de la terre. Les textes, écrits sur un papier fabriqué localement, mêlent l'arabe, le malgache et un pidgin arabe."
statut: attesté
discipline: histoire
domain: antemoro
period: [1450, 1900]
sources: [beaujard-2020]
note: "Le pouvoir politique et le pouvoir religieux sont séparés, et l'écrit relève du second. Ce n'est donc pas un peuple qui écrit, mais des lignages spécialisés à l'intérieur d'un peuple."
scope: [royaume-antemoro, antemoro]
