statement: "Les sorabe mentionnent après les formules « ce qui sert à mouiller les écrits » : des plantes ou des substances qui, mêlées à de l'eau, servent à laver le texte tracé. Le Coran y fait l'objet d'un usage talismanique, par sélection d'une phrase ou d'un mot hors de son contexte."
statut: attesté
discipline: ethnographie
domain: antemoro
period: [1450, 1900]
sources: [beaujard-2020]
note: "Un écrit qu'on lave et dont on emploie l'eau n'est pas fait pour être lu. C'est la preuve matérielle que cette écriture sert, et ne raconte pas."
scope: [royaume-antemoro, antemoro]
