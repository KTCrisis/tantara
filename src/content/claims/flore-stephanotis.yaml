statement: "Le stéphanotis est un arbuste grimpant de Madagascar, décrit par Brongniart en 1837 ; il entre dans les serres chaudes anglaises par une collection privée, celle de Mrs Lawrence à Ealing Park, où Hooker le planche en 1844 pour ses ombelles de fleurs blanc crème très parfumées."
statut: attesté
discipline: histoire
domain: flore-avant
period: [1837, 1844]
sources: [hooker-1844]
scope: [ile-madagascar]
note: "Hooker écrit que « peu de plantes auraient pu être plus bienvenues » et décrit la manière dont on la palissait alors, sur un treillis en forme de globe. Le nom du genre ne doit rien au parfum : il vient du grec stephanos, la couronne, et ous, l'oreille, d'après les cinq appendices en oreille de la couronne d'étamines. La plante entre donc en Europe par l'horticulture d'agrément, non par une exploration botanique de l'île."
