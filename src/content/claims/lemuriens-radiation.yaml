statement: "Plus de cent espèces de lémuriens vivent aujourd'hui à Madagascar et nulle part ailleurs, depuis les plus petits primates du monde, les microcèbes, jusqu'à des formes terrestres éteintes qui atteignaient la taille d'une femelle gorille."
statut: mesuré
discipline: biologie
domain: megafaune
sources: [everson-2025]
scope: [ile-madagascar]
note: "Le compte des espèces vivantes n'est pas une donnée stable : il dépend du concept d'espèce employé, et a plus que doublé depuis les années 1980 sans qu'aucun animal nouveau soit apparu. Voir l'assertion suivante."
