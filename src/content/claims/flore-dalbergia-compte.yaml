statement: "Le genre Dalbergia, celui des bois de rose et des palissandres, compte quatre-vingt-trois espèces à Madagascar, dont cinquante-cinq seulement ont été publiées, et cinquante-six d'entre elles sont des arbres assez grands pour donner du bois d'œuvre."
statut: mesuré
discipline: biologie
domain: flore-avant
sources: [rakotonirina-2023]
scope: [ile-madagascar]
note: "Vingt-huit espèces connues des botanistes mais non encore décrites : le décompte n'est pas clos. Un travail de 2016 en donnait quarante-sept endémiques, et une analyse génomique de 2022 conclut que la diversité du genre à Madagascar reste sous-estimée. Le chiffre monte à mesure qu'on regarde, comme pour les lémuriens et pour l'arbre du voyageur, et pour la même raison : ce sont les méthodes qui changent, pas les plantes."
