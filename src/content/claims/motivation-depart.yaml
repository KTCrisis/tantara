statement: "Les raisons du départ depuis l'Asie du Sud-Est (commerce, exil, dérive accidentelle, colonisation délibérée) restent inconnues."
statut: conjectural
discipline: histoire
domain: peuplement
sources: [corps-2019, adelaar-2016]
note: "Aucune source textuelle, aucun vestige n'éclaire le motif. Toutes les hypothèses publiées restent des scénarios. Adelaar y ajoute une objection de bon sens qu'aucun d'eux ne lève : la côte est-africaine, riche d'ivoire, d'or et de captifs, avait bien davantage à offrir à des marchands que cette île-ci, et l'on comprend mal qu'ils aient fait tout ce chemin pour l'ignorer."
scope: [austronesiens, ile-madagascar]
