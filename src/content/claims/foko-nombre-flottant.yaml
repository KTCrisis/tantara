statement: "Le nombre n'est pas fixe dans la littérature savante : une note critique de 1959 parle de « dix-huit à vingt peuples traditionnels », qu'elle fait apparaître avec l'époque des royaumes, aux XIVe-XVe siècles, comme des clans composites agglomérés par les circonstances et non comme des groupes distincts par nature."
statut: reconstruit
discipline: histoire
domain: foko
period: [1300, 1500]
sources: [defos-du-rau-1959]
scope: [ile-madagascar]
note: "Cette lecture place la formation des groupes avant la colonisation, ce qui n'est pas neutre sous la plume de 1959 : Hubert Deschamps, dont l'ouvrage est ici recensé, fut administrateur colonial avant d'être historien, et faire précéder les ethnies à l'administration dispense celle-ci de les avoir fabriquées. Le site retient de cette source ce qu'elle établit malgré sa position, à savoir que le compte flotte et que ces groupes sont donnés pour des agrégats, non pour des essences."
