statement: "Le brûlage régulier de ces bois favorise le tapia, qui résiste au feu, et sert la récolte de soie en réduisant les populations d'une fourmi parasite du ver ; les forestiers coloniaux ont consigné ces pratiques avec réprobation."
statut: attesté
discipline: histoire
domain: flore-avant
sources: [kull-2002]
scope: [ile-madagascar, merina]
note: "Les archives mobilisées vont des Archives nationales d'Antananarivo aux Archives d'outre-mer et à celles de la mission luthérienne norvégienne. L'auteur ajoute, en le donnant explicitement pour une position et non pour un résultat, qu'il faudrait parler de transformation plutôt que de dégradation. Le site retient la mesure et signale l'interprétation : les deux ne se valent pas."
