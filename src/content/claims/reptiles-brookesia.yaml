statement: "Le plus petit reptile adulte connu est un caméléon malgache décrit en 2021, Brookesia nana : le mâle mesure 13,5 millimètres de corps et 22 millimètres avec la queue, ce qui en fait le plus petit des quelque onze mille cinq cents espèces de reptiles recensées."
statut: mesuré
discipline: biologie
domain: faune-avant
period: [2021, 2021]
sources: [glaw-2021]
scope: [ile-madagascar]
note: "L'espèce n'est connue que de deux individus, un mâle et une femelle, trouvés dans une forêt de montagne du nord de l'île. Le titre de l'article ne porte pas d'abord sur la taille record mais sur les organes génitaux du mâle, proportionnellement énormes : chez les caméléons, plus l'espèce est petite, plus cette proportion augmente, et le nano-caméléon est le point extrême de cette relation."
