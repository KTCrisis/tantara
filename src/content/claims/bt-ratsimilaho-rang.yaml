statement: "Ratsimilaho refuse deux hiérarchies à la fois : il revendique la primauté dans son clan alors qu'il relève d'une lignée cadette, dite « des enfants de filles », et il rejette l'ordre d'autorité de la confédération tsikoa, où son statut de malata le plaçait au second rang."
statut: reconstruit
discipline: histoire
domain: betsimisaraka
period: [1710, 1720]
sources: [graeber-2023]
note: "Lecture de Graeber : le geste politique ne consiste pas à prendre la première place dans le classement existant, mais à récuser le classement."
scope: [confederation-betsimisaraka, betsimisaraka]
