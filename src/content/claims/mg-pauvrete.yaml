statement: "Près de sept Malgaches sur dix vivaient sous le seuil international d'extrême pauvreté lors du dernier relevé disponible, en 2021."
statut: mesuré
discipline: autre
domain: aujourdhui
period: [2021, 2021]
sources: [banque-mondiale-2024]
scope: [ile-madagascar]
note: "69,2 % au seuil de 2,15 dollars par jour en parité de pouvoir d'achat 2017. Le chiffre monte au-delà de 80 % dans certaines publications qui retiennent un seuil national plus élevé : la valeur donnée ici est celle de l'indicateur international, seul comparable d'un pays à l'autre. Le relevé date de 2021, aucun plus récent n'est publié."
