statement: "Le pouvoir sakalava a son fondement idéologique dans des reliques fabriquées à partir des corps des souverains, pratique devenue la règle au XVIIIe siècle avec la formation des grandes monarchies. À Majunga, dans le Boina, les reliquaires sont dits « Andriamisara efa dahy » et rangés parmi les « raha sarotra », les choses précieuses et dangereuses, terme qui désigne aussi la dépouille royale."
statut: attesté
discipline: histoire
domain: sakalava
period: [1700, 1900]
sources: [ballarin-2020]
note: "Les réceptacles portent des perles de couleur correspondant aux destins, des pièces et du métal précieux ; les piastres entrent, avec la terre crayeuse tanimalandy, dans la composition de l'eau lustrale."
scope: [sakalava, royaume-boina]
