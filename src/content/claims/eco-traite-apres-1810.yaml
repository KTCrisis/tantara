statement: "Après la conquête britannique de l'île de France en 1810, les esclaves continuent d'arriver de Madagascar en fraude ; le gouverneur Farquhar écrit en février 1811 que sans nouvelle importation d'esclaves, ces îles sont appelées à devenir des déserts."
statut: attesté
discipline: histoire
domain: economie
period: [1810, 1817]
