statement: "Les aristocrates antemoro, arrivés au XVe siècle dans le Sud-Est, ont conservé jusqu'à aujourd'hui des livres sacrés écrits en caractères arabes, appelés sorabe, « grande écriture »."
statut: attesté
discipline: histoire
domain: antemoro
period: [1450, 1900]
sources: [beaujard-2020, faublee-1970]
note: "C'est la seule écriture pratiquée à Madagascar avant que Radama Ier n'adopte l'alphabet latin en 1810, et elle est restée l'affaire d'un groupe et d'une caste de lettrés, non d'un royaume entier."
scope: [royaume-antemoro, antemoro]
