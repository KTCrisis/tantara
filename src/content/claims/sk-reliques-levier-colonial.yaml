statement: "L'administration coloniale française a tenu les reliquaires sakalava pour un levier politique. Vers 1897, le lieutenant Benevent note que « la possession de ces mânes équivaut à l'assurance de la fidélité de presque tout le pays » ; les reliques sont ensuite restituées officiellement aux Sakalava du Nord-Ouest « en gage d'obéissance et soumission », une cérémonie dont un rapport se félicite qu'elle augmente « considérablement » le prestige français."
statut: attesté
discipline: histoire
domain: sakalava
period: [1897, 1910]
sources: [ballarin-2020]
note: "Une autre formule d'administrateur résume la politique : « À chaque pays, il faudra laisser son roi, c'est le fétiche du peuple. »"
scope: [sakalava, royaume-boina]
