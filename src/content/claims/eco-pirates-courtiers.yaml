statement: "Entre 1685 et 1726 environ, les pirates installés sur la côte nord-est se font courtiers de la traite : ils vendent des captifs malgaches aux Arabes du Boina, à des Anglais de Bristol, à des Hollandais de Batavia, à des Français de la Martinique ou à des négociants de New York."
