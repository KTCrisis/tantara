note: "Filliot s'appuie sur la Collection des ouvrages anciens concernant Madagascar de Grandidier et sur Deschamps, Les pirates à Madagascar. Avant 1717, pirates et navires de passage n'apportent à Bourbon que quelques centaines d'esclaves en tout."
