statement: "Un palmier géant est resté inconnu de la science jusqu'en 2008 : Tahina spectabilis, décrit comme un genre nouveau, ne pousse que sur cinq hectares du nord-ouest de l'île, dépasse dix-huit mètres, et meurt après avoir fleuri une seule fois."
statut: mesuré
discipline: biologie
domain: flore-avant
period: [2008, 2008]
sources: [dransfield-2008]
scope: [ile-madagascar]
note: "Le genre n'a aucun proche parent parmi les quelque deux cents palmiers de l'île, ses affinités étant asiatiques. Une plante de cette taille, dans un pays herborisé depuis deux siècles, a donc échappé aux inventaires jusqu'à une découverte fortuite. Le nom est malgache et signifie « béni »."
