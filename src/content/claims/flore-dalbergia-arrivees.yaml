statement: "Les Dalbergia de Madagascar forment deux grands groupes, chacun plus proche d'espèces non malgaches que l'un de l'autre : le genre a donc atteint l'île au moins deux fois, séparément."
statut: reconstruit
discipline: génétique
domain: flore-avant
sources: [crameri-2022]
scope: [ile-madagascar]
note: "Une espèce échappe aux deux groupes, Dalbergia bracteolata, qui pousse à Madagascar comme sur le continent est-africain. Le résultat rejoint celui que la page des bêtes donne pour les mammifères : ce que l'île porte n'est pas venu d'un coup, et les lignées qu'on y trouve ensemble n'y sont pas arrivées ensemble."
