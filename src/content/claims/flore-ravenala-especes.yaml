statement: "Le genre Ravenala n'a compté qu'une seule espèce pendant deux siècles ; une révision de 2021 en reconnaît six, deux formes succulentes des basses terres côtières et quatre non succulentes échelonnées sur le versant oriental, du niveau de la mer à mille cent mètres."
statut: reconstruit
discipline: biologie
domain: flore-avant
period: [1782, 2021]
sources: [haevermans-2021]
scope: [ile-madagascar]
note: "Le même mouvement que chez les lémuriens, et la même prudence s'impose : un genre longtemps tenu pour monospécifique se fractionne quand on l'examine de près, sans qu'aucune plante inconnue soit apparue dans l'intervalle. La différence avec le cas des microcèbes est que cette révision-ci s'appuie sur des caractères morphologiques et écologiques distincts, pas sur la seule variation géographique."
