statement: "Le flamboyant est décrit dès 1828 d'après des arbres cultivés observés à Foulpointe, et planté ensuite dans toute la zone intertropicale, sans qu'on sache d'où il venait ; il faut attendre 1933 pour qu'un botaniste publie la découverte d'une station naturelle, dans l'ouest de Madagascar."
statut: attesté
discipline: histoire
domain: flore-avant
period: [1828, 1933]
sources: [leandri-1933]
scope: [ile-madagascar]
note: "Un siècle sépare la description de l'espèce de l'identification de son berceau. L'auteur écrit lui-même, avant d'annoncer sa trouvaille, que l'arbre « n'a jamais encore, je crois, été trouvé à l'état spontané ». Le cas est l'inverse du baobab, parti seul par la mer : celui-ci a fait le tour du monde dans les bagages des hommes, et sa patrie s'est perdue en route."
