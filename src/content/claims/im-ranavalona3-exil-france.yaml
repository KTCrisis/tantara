statement: "En exil, Ranavalona III gagne en France une popularité que la presse illustrée entretient, mais son image de reine s'y efface au profit de celle de la femme et de la mère ; sa photographie circule parmi les cartes à collectionner des biscuits Lefèvre-Utile, dans une série de plus de cent « célébrités contemporaines » où figurent acteurs, poètes et premiers aviateurs. Son isolement est l'œuvre du général Gallieni."
statut: attesté
discipline: histoire
domain: imerina-souverains
period: [1897, 1917]
sources: [garan-2021, aldrich-2018]
note: "L'historienne parle d'une « reine d'opérette » : une image de futilité, mais qui porte une célébrité réelle. La popularité française n'est donc pas une reconnaissance de son rang, elle en est la substitution."
scope: [royaume-imerina, merina]
