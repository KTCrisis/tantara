statement: "En 1862, devant une orchidée malgache dont l'éperon nectarifère atteint près de trente centimètres, Darwin prédit l'existence d'un papillon capable d'y puiser ; un sphinx à longue trompe est décrit en 1903 et nommé praedicta en mémoire de cette annonce, mais sa visite à la fleur n'est documentée directement qu'entre 1992 et 2004."
statut: attesté
discipline: biologie
domain: flore-avant
period: [1862, 2004]
sources: [arditti-2012]
scope: [ile-madagascar]
note: "L'histoire est citée partout comme une prédiction vérifiée, ce qu'elle est. Elle mérite d'être racontée en entier : pendant cent trente ans, le lien entre la fleur et l'insecte a été tenu pour acquis sans que personne ait observé la scène. La prédiction était juste, la preuve est arrivée bien après la conviction."
