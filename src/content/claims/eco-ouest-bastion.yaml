statement: "Les captifs venaient surtout du nord du Mozambique, pays makua et île de Moçambique, et arrivaient par la côte ouest, autour de Majunga ; dans la seconde moitié du siècle, la zone qui va de Morondava à Majunga, Maintirano compris, est un bastion de la traite illégale."
