statement: "L'escarpement oriental et la ligne de partage des eaux qui le suit font barrière topographique à la mousson venue de l'est : les précipitations et la végétation y sont commandées par le soulèvement orographique, avec des cumuls annuels de 1 200 à 1 600 mm le long de l'escarpement, quand le versant occidental reste sous le vent."
statut: mesuré
discipline: climat
domain: geographie-physique
sources: [clementucci-2025]
scope: [ile-madagascar]
note: "Le contraste est-ouest des pluies est ici rapporté à la topographie. Le site ne quantifie pas encore le versant sec : les chiffres cités portent sur l'escarpement seul."
