statement: "Selon le ministre des Colonies de l'époque, l'abolition est accueillie avec enthousiasme par les affranchis de l'Imerina, mais beaucoup d'anciens maîtres retiennent leurs anciens esclaves contre de faibles salaires ; le 2 janvier 1897, Gallieni oblige chaque habitant à justifier de moyens d'existence réguliers, sous peine de prison puis de travail forcé sur les chantiers de l'État."
statut: attesté
discipline: histoire
domain: economie
period: [1896, 1897]
sources: [lebon-1900]
scope: [ile-madagascar]
note: "Témoignage d'un acteur de la colonisation, qui conclut que « le travail obligatoire est une nécessité sociale » : le texte est un plaidoyer, et c'est pour cela qu'il est cité pour ce qu'il rapporte des mesures, non pour leur appréciation."
