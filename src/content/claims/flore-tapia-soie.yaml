statement: "Les feuilles du tapia sont le fourrage de prédilection d'un ver à soie endémique, Borocera madagascariensis, le landibe, dont les cocons sont ramassés à la main deux fois l'an, cuits, filés et tissés en lambamena, les linceuls des funérailles et des retournements de morts."
statut: attesté
discipline: ethnographie
domain: flore-avant
sources: [kull-2002]
scope: [merina, betsileo]
note: "La chrysalide est retirée du cocon et mangée. Sur le site étudié, au Col des Tapia, deux ménages sur trois récoltent le landibe et une femme sur cinq file ou tisse, la vente des cocons apportant un revenu dans les mois maigres qui précèdent la moisson. Un arbre des Hautes Terres, un papillon qui n'en mange que les feuilles, et l'étoffe dans laquelle on enveloppe les morts : la chaîne tient en trois maillons."
