statement: "Le roi Toera, dernier souverain du Menabe, est tué en 1897 lors des opérations dites de pacification, et des crânes de guerriers sakalava sont emportés en France. Une demande de prélèvement ADN est adressée au Muséum national d'histoire naturelle en juin 2014 pour établir si l'un d'eux est le sien ; le 26 août 2025, la France restitue trois crânes à Madagascar, dont celui présumé du roi, en première application de la loi de 2023 sur les restes humains."
statut: attesté
discipline: histoire
sources: [ballarin-2020, culture-gouv-2025]
domain: sakalava
note: "L'attribution reste présumée, et toutes les sources la donnent comme telle. L'assertion ne porte pas de date de fait : elle relève de l'historiographie et de ses suites, comme la compilation de Callet sur la page de l'Imerina, et n'entre donc pas dans la frise."
scope: [sakalava, royaume-menabe]
