statement: "Au XVIIIe siècle, les postes français de traite de la côte est glissent vers le sud : la baie d'Antongil d'abord, alimentée par la puissance sakalava, puis Foulpointe, sur l'arrière-pays sihanaka et bezanozano, enfin Tamatave, débouché des Merina ; Fort-Dauphin ne fournit jamais beaucoup d'esclaves."
