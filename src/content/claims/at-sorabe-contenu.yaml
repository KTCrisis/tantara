statement: "Le contenu des manuscrits sorabe est magico-religieux : formules, divination, calendrier, traditions d'origine. Au-delà d'une magie islamique, la diversité des influences qui s'y exercent fait écho à la complexité des réseaux d'échange de l'océan Indien."
statut: attesté
discipline: histoire
domain: antemoro
period: [1450, 1900]
sources: [beaujard-2020]
note: "Ces livres ne sont pas des annales. Écrire n'a pas produit d'histoire au sens où l'archive merina en produira une à partir de 1810 : la grande écriture sert le rite et le destin, pas la chronique des règnes."
scope: [royaume-antemoro, antemoro]
