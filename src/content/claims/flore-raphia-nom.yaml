statement: "Les deux noms sous lesquels ce raphia était donné pour endémique, Raphia ruffia et Raphia pedunculata, sont aujourd'hui des synonymes : l'espèce s'appelle Raphia farinifera, et le nom couvre des populations réparties de la Tanzanie au Cameroun."
statut: reconstruit
discipline: biologie
domain: flore-avant
sources: [gbif-2026]
scope: [ile-madagascar, afrique-est]
note: "Les relevés ne disent pas si les populations continentales sont d'origine ou introduites, et la question du sens de la traversée reste ouverte pour cette espèce comme pour les didiéracées. Ce qui est acquis, c'est que l'endémisme affirmé en 1933 ne tient plus : le raphia rejoint la liste des singularités que la révision des noms a défaites."
