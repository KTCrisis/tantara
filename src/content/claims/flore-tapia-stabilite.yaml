statement: "La comparaison des photographies aériennes de 1949 et de 1991 sur la région du Col des Tapia donne, sur vingt-huit zones boisées comparables, vingt sans changement, cinq plus étendues ou plus denses, et trois en recul."
statut: mesuré
discipline: biologie
domain: flore-avant
period: [1949, 1991]
sources: [kull-2002]
scope: [ile-madagascar]
note: "Une seconde comparaison, portant sur la vallée de la Manandona entre 1965 et 1986, conclut de même à la stabilité. Le résultat porte sur l'étendue, non sur la composition en espèces ni sur l'état du sous-bois, et il vaut pour ces massifs, pas pour l'ensemble des Hautes Terres."
