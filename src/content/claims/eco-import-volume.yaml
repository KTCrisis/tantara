statement: "Les historiens estiment à au moins 650 000 le nombre de captifs est-africains déportés à Madagascar au XIXe siècle, dont une part, peut-être trente pour cent, fut réexportée vers les autres îles de l'océan Indien occidental."
statut: reconstruit
discipline: histoire
domain: economie
period: [1800, 1900]
sources: [boyer-rossol-2014]
scope: [makoa, ile-madagascar]
note: "Le chiffre vient de Gwyn Campbell (1997, p. 22) et n'est lu ici que tel que Boyer-Rossol le cite. C'est une reconstruction à partir de sources lacunaires, d'où le statut ; une annonce de conférence de la même historienne (Société des africanistes, 2016) parle plus prudemment de « plusieurs centaines de milliers »."
