statement: "Ces cinq familles ne forment pas un groupe : deux d'entre elles, les Sarcolaenaceae et les Sphaerosepalaceae, appartiennent à l'ordre des Malvales, les trois autres, Physenaceae, Asteropeiaceae et Barbeuiaceae, à celui des Caryophyllales, deux branches très éloignées des plantes à fleurs."
statut: reconstruit
discipline: biologie
domain: flore-avant
sources: [apg-2016]
scope: [ile-madagascar]
note: "La conséquence est que l'endémisme au rang de la famille ne s'est pas produit une fois mais plusieurs, dans des lignées sans rapport entre elles. La classification de référence discute d'ailleurs le cas des Sarcolaenaceae, dont la délimitation demande un ajustement au vu de leur proximité avec les diptérocarpacées : la frontière entre les deux familles est encore en mouvement."
