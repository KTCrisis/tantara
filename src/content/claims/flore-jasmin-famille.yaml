statement: "Le stéphanotis appartient aux Apocynaceae, dans l'ordre des Gentianales, quand les vrais jasmins du genre Jasminum sont des Oleaceae, dans celui des Lamiales : deux branches distinctes des plantes à fleurs."
statut: reconstruit
discipline: biologie
domain: flore-avant
sources: [apg-2016]
scope: [ile-madagascar]
note: "Le rapprochement tient au parfum et à la fleur blanche en étoile, non à la parenté. Hooker rangeait d'ailleurs la plante parmi les asclépiades, un groupe aujourd'hui absorbé dans les Apocynaceae : la famille a changé de contour depuis, l'écart avec les jasmins n'a pas bougé."
