statement: "Madagascar ne porte qu'une seule espèce de raphia, que la géographie de 1933 tient pour endémique de l'île ; c'est une plante spontanée des marais et des bords de cours d'eau, que personne ne met en plantation, et les pieds parfois plantés de main d'homme ne reçoivent ensuite aucun soin."
statut: attesté
discipline: histoire
domain: flore-avant
period: [1931, 1933]
sources: [musset-1933]
scope: [ile-madagascar]
note: "L'auteur s'appuie sur le travail de Perrier de la Bâthie paru deux ans plus tôt dans la Revue de botanique appliquée, et fait de Madagascar le gros producteur mondial de la fibre. L'écart est là : une ressource exportée en quantité, et prélevée sur des peuplements entièrement sauvages."
