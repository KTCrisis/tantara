statement: "Jusque vers 1800, les captifs des Hautes Terres changent de mains deux ou trois fois, par des intermédiaires bezanozano et sihanaka, avant d'atteindre la côte ; après 1800, des marchands merina vendent eux-mêmes leurs esclaves à Tamatave."
statut: attesté
discipline: histoire
domain: economie
axes: [imerina-souverains]
period: [1790, 1810]
sources: [filliot-1974]
scope: [royaume-imerina, bezanozano, sihanaka, toamasina]
note: "Filliot ajoute que la traite a renforcé les structures royales de l'Imerina et désorganisé la côte est : « La guerre alimentait la traite. La traite alimentait la guerre. »"
