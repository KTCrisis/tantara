statement: "Entre 1980 et 2007, quarante-huit de ces systèmes ont touché terre à Madagascar, contre seize au Mozambique ; la majorité a abordé l'île par la côte est, dont dix-neuf par le seul nord-est."
statut: mesuré
discipline: climat
domain: geographie-physique
period: [1980, 2007]
sources: [mavume-2009]
scope: [ile-madagascar]
note: "Seul le premier point d'atterrage de chaque système est compté, ce qui minore les traversées suivies d'un second contact. Sur vingt-huit saisons, cela donne un peu moins de deux atterrages par an. La même étude relève quatre-vingt-huit atterrages pour 1952-1979, davantage donc, mais juge les relevés d'avant 1980 trop incertains pour qu'on y lise une tendance."
