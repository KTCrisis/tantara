statement: "En l'absence de fleurs et de fruits, la morphologie ne permet pas de séparer les espèces de Dalbergia malgaches ; deux marqueurs génétiques, un plastidial et un nucléaire, en distinguent douze sans ambiguïté."
statut: mesuré
discipline: génétique
domain: flore-avant
sources: [rakotonirina-2023]
scope: [ile-madagascar]
note: "Un arbre coupé, une planche sciée, un meuble fini : à chacun de ces stades, l'objet a perdu ce par quoi les botanistes le nommaient. Le bois seul ne dit pas de quelle espèce il vient. La bibliothèque de référence construite en 2023 couvre douze espèces, sur les cinquante-six potentiellement exploitées."
