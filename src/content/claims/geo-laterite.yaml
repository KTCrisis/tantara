statement: "La latéritisation décompose la roche en éliminant la silice et les bases, tandis que le fer et l'alumine s'y concentrent par accumulation relative ; le profil s'ordonne alors en une croûte durcie au sommet, une zone ferrugineuse rouge-brun faite d'oxydes et d'oxyhydroxydes de fer secondaires, puis la saprolite, roche décomposée qui garde encore sa structure d'origine. C'est cette zone ferrugineuse qui donne à la terre sa couleur."
statut: mesuré
discipline: géologie
domain: geographie-physique
sources: [riquier-1957, paul-2022]
scope: [ile-madagascar]
note: "Riquier insiste dès 1957 sur le critère de l'alumine libre : un sol sans alumine n'est pas latéritique mais ferrugineux tropical, et toute cuirasse n'est pas une latérite. La latérite est une matière, le lavaka une forme creusée dedans : les deux ne se confondent pas."
