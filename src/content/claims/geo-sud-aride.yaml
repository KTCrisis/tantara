statement: "À l'autre extrémité du gradient que l'escarpement oriental commande, le sud-ouest de l'île est une région semi-aride, marquée par un fort déficit hydrique, mesuré sur la période 1991-2023."
statut: mesuré
discipline: climat
domain: geographie-physique
period: [1991, 2023]
sources: [rasoafaniry-2024]
scope: [ile-madagascar]
note: "Fait qualitatif seulement : cette source n'a pas été lue au-delà de son résumé et le site ne dispose d'aucun cumul annuel fiable pour ce versant. Les 1 200 à 1 600 mm cités en face portent sur l'escarpement, chez Clementucci. Le contraste est donc établi dans son principe, pas dans ses nombres."
