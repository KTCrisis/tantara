statement: "À l'autre extrémité du gradient que l'escarpement oriental commande, le sud-ouest de l'île est une région semi-aride, marquée par un fort déficit hydrique, mesuré sur la période 1991-2023."
statut: mesuré
discipline: climat
domain: geographie-physique
period: [1991, 2023]
sources: [rasoafaniry-2024]
scope: [ile-madagascar]
note: "Cette source n'a pas été lue au-delà de son résumé, et elle établit le fait sans le chiffrer. Les cumuls manquaient jusqu'ici au site ; ils sont désormais calculés à part, sur la réanalyse ERA5. Les 1 200 à 1 600 mm cités par ailleurs portent sur l'escarpement, chez Clementucci, et non sur la côte."
