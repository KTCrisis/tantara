statement: "Le plus proche parent vivant des oiseaux-éléphants n'est pas l'autruche africaine mais le kiwi de Nouvelle-Zélande : l'ADN ancien extrait de leurs os indique que l'ancêtre commun des deux lignées volait, et que le gigantisme comme la perte du vol sont survenus après l'arrivée, séparément sur chaque terre."
statut: reconstruit
discipline: génétique
domain: faune-avant
sources: [mitchell-2014]
scope: [ile-madagascar]
note: "Le résultat contredit l'explication longtemps admise, qui faisait des grands oiseaux coureurs les héritiers passifs de la fragmentation du Gondwana : dans ce cadre, l'île s'étant séparée de l'Afrique en premier, l'autruche aurait dû être la parente la plus proche. C'est aussi ce qui justifie d'écarter les oiseaux des comptages d'arrivées par voie de mer : leurs ancêtres n'avaient besoin ni de radeau ni de pont."
