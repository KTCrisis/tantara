statement: "L'image de « l'île rouge », c'est-à-dire d'épaisses accumulations de latérite, suppose une altération chimique lente et donc de longues périodes de quiétude tectonique ; or Madagascar présente un relief jeune sur un socle ancien, avec un soulèvement rapide qui ne s'accorde pas avec cette condition."
statut: reconstruit
discipline: géologie
domain: geographie-physique
sources: [paul-2022]
scope: [ile-madagascar]
note: "Le surnom populaire n'est pas faux : la terre est rouge. C'est l'épaisseur supposée du manteau latéritique que la géologie du relief met en tension. Reconstruit et non mesuré : l'argument tient à l'incompatibilité entre un taux de soulèvement et une durée d'altération, non à une mesure directe d'épaisseur."
