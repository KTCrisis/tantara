scope: [makoa, royaume-imerina]
note: "Le jour exact ne repose que sur Boyer-Rossol 2014 ; les deux autres sources donnent l'année. Garan refuse de lire ces décrets sous le seul angle de la pression britannique : ils augmentent aussi le nombre de sujets soumis aux corvées royales, dont les esclaves étaient exemptés."
