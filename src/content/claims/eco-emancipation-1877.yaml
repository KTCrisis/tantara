statement: "Le 20 juin 1877, la reine Ranavalona II émancipe tous les « Mozambiques » (Masombika) issus de la traite extérieure ; le code des 101 articles de 1868 avait déjà interdit d'importer des esclaves d'Afrique, et une première libération partielle avait eu lieu en 1874."
