note: "Filliot cite Dumaine (1790) : « La partie d'Hancove est celle de Madagascar qui fournit le plus d'esclaves à nos îles », et l'agent Roux à Decaen (16 octobre 1807). Mayeur écrivait dès 1777 d'Antananarivo que le commerce le plus considérable qui s'y fait est celui des esclaves."
