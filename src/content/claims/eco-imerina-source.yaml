statement: "À partir de 1775 environ, les textes français signalent des esclaves venus de l'Imerina sur la côte est ; en 1790, l'Imerina est donnée comme la région qui fournit le plus d'esclaves aux îles, et en 1807 un agent français estime à 2 000 par an ceux que Tamatave en tire."
