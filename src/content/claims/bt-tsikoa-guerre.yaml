statement: "Avant la confédération betsimisaraka, la côte autour de Foulpointe relève d'un ensemble dit confédération tsikoa, dirigé depuis le sud par Ramangano. Ratsimilaho lève une rébellion contre lui ; la guerre dure huit ans et fait des milliers de morts, et c'est d'elle que sort la nouvelle entité politique."
statut: récit
discipline: histoire
domain: betsimisaraka
period: [1710, 1720]
sources: [graeber-2023]
note: "Le détail de cette guerre vient du manuscrit de Mayeur, dont vingt-quatre chapitres lui sont consacrés, et le récit y est à la gloire de Ratsimilaho."
scope: [confederation-betsimisaraka, betsimisaraka]
