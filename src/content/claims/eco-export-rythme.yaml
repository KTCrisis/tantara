statement: "À la fin de l'Ancien Régime, environ un millier d'esclaves par an quittent Madagascar pour les Mascareignes ; sous Decaen, on passe de 1 000 à 1 200 par an de 1802 à 1804 à plus de 2 000 en 1807, chiffre qui reste sans suite."
statut: reconstruit
discipline: histoire
domain: economie
period: [1769, 1807]
sources: [filliot-1974]
scope: [ile-madagascar]
note: "Filliot juge « bien trop important » le chiffre de 2 000 par an avancé par J. Valette pour la fin de l'Ancien Régime. Après 1762, la côte orientale d'Afrique dépasse Madagascar comme source d'esclaves pour les îles, et le reste."
