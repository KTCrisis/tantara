statement: "Les serpents lamprophiidés ont atteint Madagascar deux fois depuis l'Afrique : une arrivée ancienne, à l'origine d'une radiation de plus de cent espèces endémiques, les gemsnakes, et une seconde, bien plus tardive, qui n'a produit que deux espèces du genre Mimophis, resté proche des serpents à bec africains."
statut: reconstruit
discipline: biologie
domain: megafaune
sources: [burbrink-2019]
scope: [ile-madagascar]
note: "Deux arrivées de la même famille, dont l'une donne cent espèces et l'autre deux : le contraste ne s'explique pas par l'ancêtre mais par ce qu'il a trouvé en arrivant. C'est le troisième groupe de cette page, après les mammifères et les caméléons, dont l'histoire se compte en traversées séparées plutôt qu'en héritage."
