statement: "Par le traité de Tamatave du 23 octobre 1817, conclu au nom du gouverneur Farquhar, Radama Ier interdit dans tous ses territoires la vente d'esclaves destinés à quitter Madagascar, contre une rétribution annuelle de 1 000 dollars en or, 1 000 dollars en argent, cent barils de poudre, cent mousquets, dix mille pierres à fusil, des uniformes, des étoffes et deux chevaux."
statut: attesté
discipline: histoire
domain: economie
axes: [imerina-souverains]
