scope: [royaume-imerina, toamasina]
note: "Texte du traité reproduit par Ellis, missionnaire de la London Missionary Society engagé contre la traite. Farquhar y explique que Radama ne pourrait se maintenir, privé de « la grande source de son argent, de ses armes et de ses munitions, qui venait exclusivement de ce commerce ». Le chapitre de l'Histoire générale de l'Afrique écrit « 100 pierres à fusil » : le texte du traité dit dix mille."
