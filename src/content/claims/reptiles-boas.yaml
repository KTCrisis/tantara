statement: "Les boas de Madagascar, genres Sanzinia et Acrantophis, ne sont pas apparentés de près aux serpents africains : l'analyse de près de deux mille paires de bases mitochondriales les place comme groupe frère des boas néotropicaux, ceux d'Amérique du Sud et centrale."
statut: reconstruit
discipline: génétique
domain: faune-avant
sources: [vences-2001]
scope: [ile-madagascar]
note: "Le résultat a longtemps servi d'argument aux partisans d'un héritage gondwanien, la parenté transatlantique semblant appeler des continents autrefois joints. Les auteurs de cette étude ne la lisent pas ainsi : ils tiennent l'origine des boas malgaches pour une dispersion du Cénozoïque venue d'Afrique ou d'Asie, c'est-à-dire postérieure de très loin à la séparation des terres."
