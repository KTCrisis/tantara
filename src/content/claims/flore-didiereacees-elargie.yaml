statement: "En 2003, trois genres jusque-là rangés parmi les Portulacaceae, l'un d'Afrique de l'Est et deux d'Afrique australe, sont transférés dans les didiéracées au vu des données moléculaires : la famille cesse alors d'être propre à Madagascar, sans qu'aucune plante ait bougé."
statut: reconstruit
discipline: biologie
domain: flore-avant
period: [2003, 2003]
sources: [applequist-2003]
scope: [ile-madagascar, afrique-est]
note: "Calyptrotheca, deux espèces d'Afrique de l'Est tropicale, et Portulacaria et Ceraria, six à sept espèces des régions arides d'Afrique australe. Trois ans plus tôt, les deux mêmes auteurs intitulaient encore leur travail « Phylogénie de la famille endémique malgache des Didiereaceae ». Ils notent que ces trois genres africains, contrairement à la plupart des Portulacaceae, poussent en zone sèche, « d'où une dispersion vers Madagascar a pu se produire ». Le sens de la traversée reste ouvert dans leur texte : ils écrivent seulement qu'elle a pu partir de là."
