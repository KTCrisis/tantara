statement: "Les baobabs viennent de Madagascar : le séquençage des génomes des huit espèces vivantes place le centre d'origine du genre Adansonia sur l'île, où six d'entre elles sont propres, et fait des deux autres, celle d'Afrique continentale et celle du nord-ouest australien, les descendantes de dispersions parties de là."
statut: reconstruit
discipline: génétique
domain: flore-avant
period: [-21000000, 0]
sources: [wan-2024]
scope: [ile-madagascar]
note: "L'arbre le plus associé aux paysages d'Afrique n'y serait donc arrivé que par la mer, et tard. Le genre n'a pas de registre fossile, ce qui prive ces datations de contrôle direct et explique qu'elles reposent entièrement sur l'horloge moléculaire. Le compte des espèces malgaches varie de six à sept selon le traitement taxinomique retenu ; celui donné ici est celui de l'étude citée."
