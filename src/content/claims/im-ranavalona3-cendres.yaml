statement: "Morte à Alger en 1917, Ranavalona III y reste inhumée vingt et un ans ; ses cendres ne sont ramenées à Madagascar qu'en octobre 1938, le maintien de la défunte loin de la terre des ancêtres ayant fini par poser question dans l'île."
statut: attesté
discipline: histoire
domain: imerina-souverains
period: [1917, 1938]
sources: [garan-2020]
note: "Sa mort en 1897 n'avait pas provoqué de réaction notable à Madagascar ; c'est la sépulture éloignée, contraire à la tradition funéraire malgache, qui a rouvert la question deux décennies plus tard."
scope: [royaume-imerina, merina]
