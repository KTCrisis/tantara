statement: "La confédération a tenu une bande côtière de près de sept cents kilomètres. Ceux qui vivent aujourd'hui sur ce territoire se disent toujours Betsimisaraka, et passent pour l'un des peuples les plus obstinément égalitaires de Madagascar."
statut: attesté
discipline: ethnographie
domain: betsimisaraka
sources: [graeber-2023]
note: "Le nom lui-même se traduit par « les nombreux inséparables ». L'assertion ne porte pas de date de fait : elle rapporte un état présent et une réputation, pas un événement."
scope: [confederation-betsimisaraka, betsimisaraka]
