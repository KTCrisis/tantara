statement: "Le relevé de soixante variétés de malgache, douze mille quatre cent vingt termes collectés sur le terrain en 2018-2019, écarte délibérément les noms d'ethnies pour identifier les parlers : chaque variété est désignée par le lieu où elle a été recueillie, certains groupes traditionnels étant l'héritage d'événements historiques plutôt que des communautés partageant une langue."
statut: mesuré
discipline: linguistique
domain: foko
period: [2018, 2019]
sources: [serva-2020]
scope: [ile-madagascar]
note: "C'est une raison méthodologique, énoncée par les auteurs pour justifier leur protocole, et non une thèse sur l'origine du découpage. Elle suffit pourtant à séparer deux questions qu'on confond : le nombre de groupes reconnus, et le nombre de parlers distincts. Les deux ne se recouvrent pas, et la carte des seconds ne se déduit pas de la liste des premiers."
