statement: "Vers 1820, l'expansion de Radama Ier atteint le pays sakalava ; le roi Andriantsoly fuit vers le nord en abandonnant les reliques royales, et ses descendants se divisent en deux segments dynastiques rivaux, Bemihisatra et Bemazava, dont l'antagonisme reste vivace jusqu'à aujourd'hui."
statut: attesté
discipline: histoire
domain: sakalava
period: [1820, 1900]
sources: [ballarin-2020]
note: "Perdre les reliques ne prive pas d'un symbole mais de la légitimité elle-même : la scission qui suit dure deux siècles."
scope: [sakalava, royaume-boina, merina]
