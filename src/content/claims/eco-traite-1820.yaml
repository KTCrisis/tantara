statement: "Le gouverneur intérimaire Hall ayant refusé de verser les subsides, l'accord est rompu, puis renouvelé à Antananarivo le 11 octobre 1820 par l'agent britannique Hastie, Radama exigeant que vingt jeunes sujets soient instruits, dix en Angleterre et dix à Maurice."
