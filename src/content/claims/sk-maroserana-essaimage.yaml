statement: "Les monarchies sakalava de l'Ouest (Fiherena, Menabe, Boina, Nord-Ouest) procèdent d'un même groupe royal, les Maroseraña : les conflits de succession y sont résolus par le départ des cadets évincés, qui vont conquérir de nouveaux espaces plutôt que de disputer l'ancien."
statut: attesté
discipline: histoire
domain: sakalava
period: [1650, 1820]
sources: [ballarin-2020]
note: "Mécanisme inverse de celui de l'Imerina, où le partage d'Andriamasinavalona entre ses quatre fils ouvre quatre-vingts ans de morcellement. Le même geste, la division dynastique, y paralyse et ici étend."
scope: [sakalava, royaume-menabe, royaume-boina]
